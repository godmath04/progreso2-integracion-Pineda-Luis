version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: progreso2-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - progreso2-rabbitmq-data:/var/lib/rabbitmq

volumes:
  progreso2-rabbitmq-data:
    name: progreso2-rabbitmq-data